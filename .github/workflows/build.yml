name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Tao project
        run: |
          mkdir -p src/main/java/com/sandpickup src/main/resources
          cp SandPickupClient.java src/main/java/com/sandpickup/
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'com.sandpickup'
          base { archivesName = 'sandpickup' }
          dependencies {
              minecraft 'com.mojang:minecraft:1.21.11'
              mappings 'net.fabricmc:yarn:1.21.11+build.4:v2'
              modImplementation 'net.fabricmc:fabric-loader:0.18.4'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          EOF
          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "sandpickup",
            "version": "1.0.0",
            "name": "SandPickup",
            "environment": "client",
            "entrypoints": { "client": ["com.sandpickup.SandPickupClient"] },
            "depends": { "fabricloader": ">=0.18.0", "minecraft": "1.21.11", "fabric-api": "*" }
          }
          EOF
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sandpickup-jar
          path: build/libs/sandpickup-1.0.0.jar
